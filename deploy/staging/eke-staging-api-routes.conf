# Replace the previous public-only regex in the STAGING HTTPS server.
# Spring remains the authority for ADMIN writes, CSRF and News media visibility.
# No prefix proxy: registration, messages/email and H2 stay behind /api/ -> 404.
location ~ ^/api/auth/(csrf|me)$ {
    limit_except GET { deny all; }
    include /etc/nginx/snippets/eke-staging-api-proxy.conf;
}
location ~ ^/api/auth/(authenticate|logout)$ {
    limit_except POST { deny all; }
    include /etc/nginx/snippets/eke-staging-api-proxy.conf;
}
location ~ "^/api/(projects/(?:public|recent|get/[0-9a-fA-F-]{36}|slug/[a-z0-9-]+)?|news/(?:homepage|public(?:/[0-9]+)?|slug/[a-z0-9-]+)|opportunities/(?:public|slug/[a-z0-9-]+)|training/(?:sessions|slug/[a-z0-9-]+)|uploads/(?:news|images|pdf)/[^/;]+)$" {
    limit_except GET { deny all; }
    # Always proxy media through Spring; never alias the uploads directory.
    include /etc/nginx/snippets/eke-staging-api-proxy.conf;
}
location ~ ^/api/(news|projects)$ {
    limit_except GET POST { deny all; }
    client_max_body_size 50m;
    include /etc/nginx/snippets/eke-staging-api-proxy.conf;
}
location ~ ^/api/news/[0-9]+$ {
    limit_except GET PUT DELETE { deny all; }
    client_max_body_size 50m;
    include /etc/nginx/snippets/eke-staging-api-proxy.conf;
}
location ~ "^/api/projects/[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$" {
    limit_except PUT DELETE { deny all; }
    client_max_body_size 50m;
    include /etc/nginx/snippets/eke-staging-api-proxy.conf;
}
location = /api/projects/media {
    limit_except POST { deny all; }
    client_max_body_size 50m;
    include /etc/nginx/snippets/eke-staging-api-proxy.conf;
}
location ~ ^/api/(opportunities|training)/admin$ {
    limit_except GET POST { deny all; }
    include /etc/nginx/snippets/eke-staging-api-proxy.conf;
}
location ~ ^/api/(opportunities|training)/admin/[0-9]+$ {
    limit_except PUT DELETE { deny all; }
    include /etc/nginx/snippets/eke-staging-api-proxy.conf;
}
