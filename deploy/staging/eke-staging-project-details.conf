# Optional include in the existing STAGING HTTPS server only.
# Uses the existing static root. No proxy, runtime, service or port.
location ~ ^/projects/[^/.]+/?$ {
    try_files /projects/details/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
