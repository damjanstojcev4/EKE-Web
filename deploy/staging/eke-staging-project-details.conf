# OPTIONAL staging HTTPS-server include; activate only after the runtime is ready.
# Preserve existing static/API rules. Never install in production.
location ~ ^/projects/[^/]+/?$ {
    proxy_pass http://127.0.0.1:3101;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_cache off;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
# assetPrefix maps /_next-details/_next/static/... onto the runtime's /_next/static/...
location ^~ /_next-details/ {
    proxy_pass http://127.0.0.1:3101/;
    proxy_cache off;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
