name: Deploy production (inactive until cutover)
on:
  workflow_dispatch:
# At the reviewed cutover, add push: branches: [main] and replace the
# literal false below. Retire legacy frontend.yaml/backend.yaml FIRST.
permissions:
  contents: read
concurrency:
  group: eke-production-deployment
  cancel-in-progress: false
jobs:
  checks:
    if: ${{ false }}
    uses: ./.github/workflows/ci.yml
    with:
      publish: true
      existing_site_url: ${{ vars.PRODUCTION_EXISTING_SITE_URL }}
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && vars.PRODUCTION_PIPELINE_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_ENV: production
      DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
      FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
      BACKEND_ENABLED: ${{ vars.PRODUCTION_BACKEND_ENABLED }}
      INFRA_READY: ${{ vars.PRODUCTION_INFRA_READY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: frontend-artifact
      - uses: actions/download-artifact@v4
        with:
          name: backend
          path: backend-artifact
      - name: Deploy approved releases with health checks
        run: bash deploy/release.sh frontend-artifact backend-artifact
