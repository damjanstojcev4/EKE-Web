name: Build Backend
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'Backend/**'
  pull_request:
    branches: ['main']
    paths:
      - 'Backend/**'
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven
      - run: cd Backend/ece-website && mvn clean install
      - run: cd Backend/ece-website && mkdir staging && cp target/*.jar staging
      - uses: actions/upload-artifact@v4
        with:
          name: JavaBackend
          path: Backend/ece-website/staging

  Deploy:
    runs-on: ubuntu-latest
    needs: Build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    concurrency:
      group: eke-legacy-production-backend
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock

    steps:
      - uses: actions/checkout@v5
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: JavaBackend
          path: java-backend
      - name: Setup ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
          ssh-add - <<< "$DEPLOY_SSH_KEY"

      - name: Install jar and restart the production service
        shell: bash
        run: |
          shopt -s nullglob
          jars=(java-backend/*.jar)
          [[ "${#jars[@]}" == 1 ]] || { echo 'Expected one backend jar' >&2; exit 1; }
          checksum=$(sha256sum "${jars[0]}")
          printf -v remote_script '%q' "$(cat deploy/legacy-production-backend.sh)"
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes -l "$DEPLOY_USERNAME" -- "$DEPLOY_HOST" \
            "bash -c $remote_script -- ${checksum%% *}" < "${jars[0]}"
