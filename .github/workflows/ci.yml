name: CI
on:
  pull_request:
    branches: [staging, main]
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      existing_site_url:
        type: string
        default: ''
      seo_environment:
        type: string
        default: 'staging'
permissions:
  contents: read
jobs:
  deployment-safety:
    name: Deployment safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/release.sh && bash -n deploy/activate-release.sh
      - run: bash deploy/test-release.sh
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Frontend/ece-website
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_EXISTING_SITE_URL: ${{ inputs.existing_site_url }}
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
      SEO_ENVIRONMENT: ${{ inputs.seo_environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/ece-website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:seo
      - run: npm run build
      - run: npm run verify:seo
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify static export
        run: test -s out/index.html && test -s out/404.html && test -d out/_next/static
      - name: Verify export and graceful reload with native Nginx
        shell: bash
        run: |
          # Extract the binary without installing/starting a system service or TCP listener.
          sudo apt-get update
          nginx_bundle="$RUNNER_TEMP/project-details-nginx"
          mkdir -p "$nginx_bundle/packages"
          cd "$nginx_bundle/packages"
          apt-get download nginx
          for package in ./*.deb; do dpkg-deb -x "$package" "$nginx_bundle"; done
          python3 "$GITHUB_WORKSPACE/deploy/test-project-details-nginx.py" \
            --nginx "$nginx_bundle/usr/sbin/nginx" \
            --export-root "$GITHUB_WORKSPACE/Frontend/ece-website/out"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: Frontend/ece-website/out/
          if-no-files-found: error
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRING_DATASOURCE_URL: 'jdbc:h2:mem:eke_ci;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE'
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ''
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_H2_CONSOLE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, test and package with isolated in-memory database
        working-directory: Backend/ece-website
        run: bash ./mvnw -B -ntp verify
      - name: Prepare backend artifact and source identity
        shell: bash
        run: |
          mkdir backend-artifact
          cp Backend/ece-website/target/*.jar backend-artifact/app.jar
          git rev-parse HEAD:Backend/ece-website > backend-artifact/source-id
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: backend-artifact/
          if-no-files-found: error
  full-stack:
    name: Real Spring Boot and H2 browser checks
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/ece-website/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: Frontend/ece-website/out
      - uses: actions/download-artifact@v4
        with:
          name: backend
          path: Backend/ece-website/target
      - run: mv Backend/ece-website/target/app.jar Backend/ece-website/target/ece-website-0.0.1-SNAPSHOT.jar
      - run: npm ci
        working-directory: Frontend/ece-website
      - run: npx playwright install --with-deps chromium
        working-directory: Frontend/ece-website
      - run: node scripts/full-stack-qa.mjs
        working-directory: Frontend/ece-website
